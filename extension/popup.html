<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px system-ui; width: 280px; padding: 12px; color: #0f172a; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      .row { display: flex; justify-content: space-between; margin: 4px 0; }
      .green { color: #0f766e; font-weight: 600; }
      .red { color: #b91c1c; font-weight: 600; }
      input { width: 100%; padding: 6px; margin: 4px 0 10px; box-sizing: border-box; }
      button { padding: 6px 10px; cursor: pointer; }
      .muted { color: #64748b; font-size: 11px; }
      .warn { font-size: 11px; color: #b91c1c; }
    </style>
  </head>
  <body>
    <h1>LodgeTrack Growth</h1>
    <div class="muted">read-only discovery harness (no likes · no DMs · no posts)</div>
    <hr />
    <div class="row"><span>LinkedIn rows</span><span class="green" id="st-linkedin">–</span></div>
    <div class="row"><span>X rows</span><span class="green" id="st-x">–</span></div>
    <div class="row"><span>Facebook rows</span><span class="green" id="st-facebook">–</span></div>
    <div class="row"><span>Reddit rows</span><span class="green" id="st-reddit">–</span></div>
    <button id="toggle" style="width:100%;margin:6px 0">⏸ Pause this site's capture</button>
    <hr />
    <label>Scout endpoint</label>
    <input id="endpoint" placeholder="http://127.0.0.1:8787" />
    <label>Ingest token</label>
    <input id="token" placeholder="from scout .env (SCOUT_INGEST_TOKEN)" />
    <button id="save">Save & test</button>
    <div id="status" class="muted"></div>
    <hr />
    <div class="warn">Selectors are blind-build v0.1 — verify adapter health in scout digest. Never test on your primary LinkedIn account.</div>
    <script src="popup.js"></script>
  </body>
</html>
